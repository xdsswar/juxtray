/*
 * Root settings: declares the modules of the build.
 *
 *   juxtray    : the tray icon library itself (published artifact).
 *   demo       : a JavaFX sample application that consumes the library.
 *   visualtest : end-to-end visual test on a real desktop (run on purpose:
 *                it takes over the mouse and keyboard).
 */
pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'juxtray'

include 'juxtray'
include 'demo'
include 'visualtest'
